## Render Blueprint — Wilkem Edge backend (Django + Celery + Beat)
##
## After signing in to render.com:
##   1. New + → Blueprint → connect this GitHub repo → it picks up this file.
##   2. Render creates three services automatically.
##   3. Fill in the env vars marked `sync: false` in each service's dashboard.
##   4. Add a Redis instance separately (Render free tier excludes Redis).
##
## DATABASE_URL points to your existing Neon Postgres — paste it into each
## service. REDIS_URL points to the Render Redis you create.
##
## Web service must NOT be on the free tier — M-Pesa callbacks must respond
## in under 5 seconds; free-tier cold starts violate that.

services:
  # ---------------------------------------------------------------------------
  # Django API (gunicorn)
  # ---------------------------------------------------------------------------
  - type: web
    name: wilkemedge-api
    runtime: python
    plan: starter
    rootDir: backend
    buildCommand: "./build.sh"
    startCommand: "./start.sh"
    healthCheckPath: /api/health/
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: DJANGO_DEBUG
        value: "False"
      - key: WEB_CONCURRENCY
        value: "3"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false
      # Co-op Bank IPN
      - key: COOP_IPN_TOKEN
        sync: false
      - key: COOP_ACCOUNT_NUMBER
        value: "01136069098300"
      - key: COOP_IPN_ALLOWED_IPS
        sync: false
      - key: COOP_IPN_TRUSTED_PROXY_COUNT
        value: "1"
      - key: ADMIN_ALERT_PHONE
        sync: false
      - key: ADMIN_ALERT_EMAIL
        sync: false
      - key: DIRECTOR_ALERT_PHONE
        sync: false
      - key: DIRECTOR_ALERT_EMAIL
        sync: false
      # Login email of the director who may authorise IPN reversals in the
      # Django admin. Blank falls back to superuser-only.
      - key: DIRECTOR_EMAIL
        sync: false
      # Bearer token for POST /api/payments/coop/reconcile-daily/. Point a free
      # external scheduler (cron-job.org, GitHub Actions) at that endpoint daily
      # — Render's Cron Job add-on is not needed. Copy the generated value out
      # of the dashboard when configuring the scheduler.
      - key: RECONCILIATION_TRIGGER_TOKEN
        generateValue: true
      - key: MPESA_ACCOUNT_PREFIX
        value: "90290"
      # Africa's Talking
      - key: AT_API_KEY
        sync: false
      - key: AT_USERNAME
        sync: false
      - key: AT_SENDER_ID
        sync: false
      - key: RENT_REMINDER_LEAD_DAYS
        value: "3"
      # Email
      - key: EMAIL_BACKEND
        value: django.core.mail.backends.smtp.EmailBackend
      - key: EMAIL_HOST
        value: smtp.gmail.com
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USE_TLS
        value: "True"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      # Error monitoring. Sentry stays dormant unless SENTRY_DSN is set.
      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_ENVIRONMENT
        value: production

  # ---------------------------------------------------------------------------
  # Celery worker — sends SMS/email, processes async tasks
  # ---------------------------------------------------------------------------
  - type: worker
    name: wilkemedge-celery
    runtime: python
    plan: starter
    rootDir: backend
    buildCommand: "pip install -r requirements/prod.txt"
    startCommand: "celery -A celery_app worker --loglevel=info --concurrency=2"
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: DJANGO_SECRET_KEY
        fromService:
          type: web
          name: wilkemedge-api
          envVarKey: DJANGO_SECRET_KEY
      - key: DJANGO_ALLOWED_HOSTS
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: AT_API_KEY
        sync: false
      - key: AT_USERNAME
        sync: false
      - key: AT_SENDER_ID
        sync: false
      - key: EMAIL_BACKEND
        value: django.core.mail.backends.smtp.EmailBackend
      - key: EMAIL_HOST
        value: smtp.gmail.com
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USE_TLS
        value: "True"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      # The tasks in apps/payments/tasks.py execute HERE, not on the web
      # service, so every setting they read must be present in this env too.
      # Without these the alert tasks resolve empty recipients and silently
      # send nothing.
      - key: ADMIN_ALERT_PHONE
        sync: false
      - key: ADMIN_ALERT_EMAIL
        sync: false
      - key: DIRECTOR_ALERT_PHONE
        sync: false
      - key: DIRECTOR_ALERT_EMAIL
        sync: false
      - key: RENT_REMINDER_LEAD_DAYS
        value: "3"
      - key: MPESA_ACCOUNT_PREFIX
        value: "90290"
      # Password-reset emails are rendered by apps/accounts/tasks.py on this
      # worker; without FRONTEND_URL the reset link in the email is broken.
      - key: FRONTEND_URL
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_ENVIRONMENT
        value: production

  # ---------------------------------------------------------------------------
  # Celery beat — schedules nightly status sweep + monthly arrears job
  # ---------------------------------------------------------------------------
  - type: worker
    name: wilkemedge-beat
    runtime: python
    plan: starter
    rootDir: backend
    buildCommand: "pip install -r requirements/prod.txt"
    startCommand: "celery -A celery_app beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler"
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: DJANGO_SECRET_KEY
        fromService:
          type: web
          name: wilkemedge-api
          envVarKey: DJANGO_SECRET_KEY
      - key: DJANGO_ALLOWED_HOSTS
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      # Beat only dispatches work; a crash here is otherwise silent.
      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_ENVIRONMENT
        value: production
