name: Scheduled jobs

# Drives the app's recurring tasks by calling the token-gated cron endpoints
# (/api/payments/cron/<job>/). There is no Celery beat in production, so this
# workflow IS the scheduler.
#
# Requires, in the repo's Settings → Secrets and variables → Actions:
#   - secret   CRON_TRIGGER_TOKEN  (must equal CRON_TRIGGER_TOKEN in Render)
#   - variable API_BASE_URL        (e.g. https://<your-api-domain>/api)
#
# Every tenant is invoiced a month ahead — next month's rent plus this month's
# water, due on the 5th — and the monthly pair fires on the day each kind of
# letting is invoiced. Both days are load-bearing; dropping either leaves half
# the portfolio uninvoiced until the catch-up on the 1st.
#
#   25th — COMMERCIAL. 25 September raises and sends October, so the arcade's
#          VAT invoice is in hand before the month it covers.
#   28th — RESIDENTIAL. 28 September raises and sends October, with September's
#          water read up to that day.
#   1st  — CATCH-UP for both. Sends nothing new when the 25th and 28th worked;
#          otherwise the invoice still arrives before rent falls due.
#
# Each run serves whichever tenants that day applies to and skips the rest as
# already-sent, so no run has to know who it is "for" — the statement dedupe
# key is the month stated. apps/payments/billing_calendar.py owns the rule and
# lists what else depends on it.
#
# Order matters on both days. monthly-arrears raises the rent; a statement
# emailed before it has run states a balance with the stated month missing from
# it. Half an hour apart is ample — arrears is a handful of queries per tenant.
#
# The 25th and 28th are also STATEMENT_RUN_DAY and RESIDENTIAL_RUN_DAY in
# Django settings, which is what the jobs use to work out WHICH month a tenant
# is on. Each pair has to move together: change only a cron line and the jobs
# fire on a day that bills the month already in progress; change only the
# setting and nothing is invoiced on the new day.
#
# monthly-arrears bills every month a tenant is short of, not just one, so a
# failed run is repaired by the next, before that morning's statements go out.
#
# NOTE: scheduled workflows only run from the repository's DEFAULT branch, so
# this must be merged to that branch (main) to start firing. Times are UTC;
# EAT = UTC+3.

on:
  schedule:
    - cron: "0 5 * * *"    # rent-reminders        08:00 EAT
    - cron: "0 6 * * *"    # arrears-reminders      09:00 EAT
    - cron: "0 22 * * *"   # recalculate-statuses   01:00 EAT (next day)
    - cron: "0 15 * * *"   # daily-reconciliation   18:00 EAT
    - cron: "30 3 25 * *"  # monthly-arrears       25th, 06:30 EAT (commercial: next month)
    - cron: "0 4 25 * *"   # monthly-statements    25th, 07:00 EAT (commercial: next month)
    - cron: "30 3 28 * *"  # monthly-arrears       28th, 06:30 EAT (residential: next month)
    - cron: "0 4 28 * *"   # monthly-statements    28th, 07:00 EAT (residential: next month)
    - cron: "30 3 1 * *"   # monthly-arrears        1st, 06:30 EAT (catch-up for both)
    - cron: "0 4 1 * *"    # monthly-statements     1st, 07:00 EAT (catch-up for both)
  workflow_dispatch:
    inputs:
      job:
        description: "Job slug to run now"
        required: true
        type: choice
        options:
          - rent-reminders
          - arrears-reminders
          - recalculate-statuses
          - daily-reconciliation
          - monthly-arrears
          - monthly-statements

concurrency:
  group: scheduled-jobs
  cancel-in-progress: false

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve job slug
        id: resolve
        run: |
          case "${{ github.event.schedule }}" in
            "0 5 * * *")  slug="rent-reminders" ;;
            "0 6 * * *")  slug="arrears-reminders" ;;
            "0 22 * * *") slug="recalculate-statuses" ;;
            "0 15 * * *") slug="daily-reconciliation" ;;
            "30 3 1 * *")  slug="monthly-arrears" ;;
            "0 4 1 * *")   slug="monthly-statements" ;;
            "30 3 25 * *") slug="monthly-arrears" ;;
            "0 4 25 * *")  slug="monthly-statements" ;;
            "30 3 28 * *") slug="monthly-arrears" ;;
            "0 4 28 * *")  slug="monthly-statements" ;;
            *)            slug="${{ github.event.inputs.job }}" ;;
          esac
          if [ -z "$slug" ]; then echo "Could not resolve a job slug"; exit 1; fi
          echo "slug=$slug" >> "$GITHUB_OUTPUT"
          echo "Running job: $slug"

      - name: Call cron endpoint
        env:
          TOKEN: ${{ secrets.CRON_TRIGGER_TOKEN }}
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          SLUG: ${{ steps.resolve.outputs.slug }}
        run: |
          if [ -z "$TOKEN" ]; then echo "::error::CRON_TRIGGER_TOKEN secret is not set"; exit 1; fi
          if [ -z "$API_BASE_URL" ]; then echo "::error::API_BASE_URL variable is not set"; exit 1; fi
          # monthly-statements renders a PDF per tenant, so it needs longer
          # than the rest. If it is cut off part-way the run is still safe to
          # repeat: each statement is deduped per tenant per month, so the
          # next run resumes with whoever was not reached.
          max_time=120
          if [ "$SLUG" = "monthly-statements" ]; then max_time=600; fi
          code=$(curl -sS -o response.txt -w "%{http_code}" --max-time "$max_time" -X POST \
            -H "Authorization: Bearer $TOKEN" \
            "${API_BASE_URL%/}/payments/cron/${SLUG}/")
          echo "job=$SLUG http_status=$code"
          echo "--- response ---"; cat response.txt || true; echo
          if [ "$code" != "200" ]; then echo "::error::job $SLUG returned HTTP $code"; exit 1; fi
